<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Órigo Laticínios</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#1a120b; --bg2:#20160d; --card:#291c11; --card2:#332415;
    --amber:#d98a2b; --amber2:#e8a13c; --amber-dim:#9c6a2a;
    --butter:#f0c15a; --wood:#4a3826;
    --txt:#f5ead6; --txt-dim:#c2ac8c; --line:#3a2b1b; --green:#7a9a4e; --red:#c56a3f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;line-height:1.5;min-height:100vh}
  h1,h2,h3,.serif{font-family:'Playfair Display',serif}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}
  .hidden{display:none!important}

  /* LOGIN */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(circle at 50% 0%,#2a1c0e,#140d07)}
  .login-card{max-width:380px;width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:34px 28px;text-align:center}
  .login-selo{width:74px;height:74px;border-radius:50%;margin:0 auto 14px;border:2px solid var(--amber);
    background:radial-gradient(circle at 40% 32%,#e8a13c,#a8601a 70%,#5c3410);display:flex;align-items:center;justify-content:center}
  .login-selo span{font-family:'Playfair Display',serif;font-weight:800;color:#2a1808;font-size:26px}
  .login-card h1{color:var(--butter);font-size:26px;margin-bottom:2px}
  .login-card .sub{color:var(--txt-dim);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:24px}
  .fld{text-align:left;margin-bottom:14px}
  .fld label{font-size:12px;color:var(--txt-dim);font-weight:600;display:block;margin-bottom:5px}
  .fld input,.fld select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--txt);font-size:14px}
  .btn{background:linear-gradient(135deg,var(--amber2),var(--amber));color:#2a1808;border:none;border-radius:10px;padding:12px 20px;font-weight:700;font-size:14px;width:100%}
  .btn:active{transform:translateY(1px)}
  .btn-sec{background:transparent;border:1px solid var(--amber-dim);color:var(--amber2);width:auto;padding:9px 16px;font-size:13px}
  .btn-sm{width:auto;padding:7px 13px;font-size:12px;border-radius:8px}
  .msg{font-size:13px;margin-top:12px;min-height:18px}
  .msg.err{color:var(--red)} .msg.ok{color:var(--green)}

  /* APP */
  #app{max-width:1000px;margin:0 auto;padding:0 16px 60px}
  .topbar{display:flex;align-items:center;gap:13px;padding:18px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .tb-selo{width:46px;height:46px;border-radius:50%;flex-shrink:0;border:2px solid var(--amber);
    background:radial-gradient(circle at 40% 32%,#e8a13c,#a8601a 70%,#5c3410);display:flex;align-items:center;justify-content:center}
  .tb-selo span{font-family:'Playfair Display',serif;font-weight:800;color:#2a1808;font-size:16px}
  .tb-brand h2{font-size:20px;color:var(--butter);line-height:1}
  .tb-brand small{color:var(--txt-dim);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
  .tb-user{margin-left:auto;text-align:right;font-size:12px;color:var(--txt-dim)}
  .tb-user b{color:var(--txt);display:block;font-size:13px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:16px 0}
  .tab{padding:8px 15px;border-radius:9px;font-size:13px;font-weight:600;color:var(--txt-dim);background:var(--card);border:1px solid var(--line)}
  .tab.on{background:linear-gradient(135deg,var(--amber2),var(--amber));color:#2a1808;border-color:var(--amber2)}
  .view{padding:6px 0 20px}
  h2.sec{font-size:20px;color:var(--butter);margin-bottom:14px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px}
  .stat .n{font-family:'Playfair Display',serif;font-size:27px;font-weight:800;color:var(--butter)}
  .stat .l{font-size:11px;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.09em;margin-top:2px}

  .panel{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .panel h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber2);margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .f{display:flex;flex-direction:column;gap:5px;margin-bottom:4px}
  .f.full{grid-column:1/-1}
  .f label{font-size:12px;color:var(--txt-dim);font-weight:600}
  .f input,.f select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--txt);font-size:14px;width:100%}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:9px 11px;color:var(--txt-dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line)}
  td{padding:10px 11px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  .mono{font-family:monospace;color:var(--butter);font-weight:600;font-size:12px}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .pill.lib{background:rgba(122,154,78,.18);color:var(--green);border:1px solid rgba(122,154,78,.4)}
  .pill.rest{background:rgba(217,138,43,.16);color:var(--amber2);border:1px solid rgba(217,138,43,.4)}
  .pill.ativa{background:rgba(122,154,78,.18);color:var(--green);border:1px solid rgba(122,154,78,.4)}
  .pill.em_processo{background:rgba(217,138,43,.16);color:var(--amber2);border:1px solid rgba(217,138,43,.4)}
  .pill.suspensa{background:rgba(197,106,63,.16);color:var(--red);border:1px solid rgba(197,106,63,.4)}
  .pill.em_cura{background:rgba(217,138,43,.16);color:var(--amber2);border:1px solid rgba(217,138,43,.4)}
  .pill.liberado{background:rgba(122,154,78,.18);color:var(--green);border:1px solid rgba(122,154,78,.4)}

  .chk{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line);cursor:pointer}
  .chk:last-child{border-bottom:none}
  .chk input{width:17px;height:17px;accent-color:var(--amber)}
  .chk .tag{margin-left:auto;font-size:10px;color:var(--amber-dim)}
  .arti-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber2);margin:14px 0 6px;display:flex;gap:8px;align-items:center}
  .arti-h .b{background:var(--amber-dim);color:#2a1808;font-size:9px;padding:2px 7px;border-radius:20px}

  .row-act{display:flex;gap:6px;flex-wrap:wrap}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--amber-dim);color:var(--txt);padding:12px 20px;border-radius:10px;font-size:14px;z-index:50;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
  .mat-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px}
  .mat-row .info{flex:1}
  .bar{height:7px;background:var(--bg);border-radius:20px;overflow:hidden;margin-top:7px;border:1px solid var(--line)}
  .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--amber-dim),var(--butter))}
  .days .big{font-family:'Playfair Display',serif;font-size:22px;font-weight:800;color:var(--butter);text-align:right}
  .empty{color:var(--txt-dim);text-align:center;padding:26px;font-size:14px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
  .modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:420px;width:100%;text-align:center}
  .modal img{width:220px;height:220px;background:#fff;border-radius:10px;padding:8px}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <div class="login-card">
    <div class="login-selo"><span>Ó</span></div>
    <h1>Órigo</h1>
    <div class="sub">Laticínios · Rastreabilidade</div>
    <div class="fld"><label>E-mail</label><input id="lg-email" type="email" placeholder="voce@exemplo.com"></div>
    <div class="fld"><label>Senha</label><input id="lg-senha" type="password" placeholder="••••••••"></div>
    <button class="btn" onclick="fazerLogin()">Entrar</button>
    <div class="msg" id="lg-msg"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="tb-selo"><span>Ó</span></div>
    <div class="tb-brand"><h2>Órigo</h2><small>Laticínios</small></div>
    <div class="tb-user">
      <b id="u-nome">—</b>
      <span id="u-perfil">—</span> · <a href="#" onclick="sair();return false" style="color:var(--amber2)">sair</a>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="view" id="view"></div>
</div>

<div class="toast" id="toast"></div>

const sb=supabase.createClient(SB_URL,SB_ANON);
let ME=null; // {id,nome,perfil,estabelecimento_id}
let ESTAB=null; // dados do estabelecimento (quando perfil=estabelecimento)

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hoje(){return new Date().toISOString().slice(0,10);}

async function fazerLogin(){
  const email=document.getElementById('lg-email').value.trim();
  const senha=document.getElementById('lg-senha').value;
  const msg=document.getElementById('lg-msg');
  msg.className='msg';msg.textContent='Entrando…';
  const {data,error}=await sb.auth.signInWithPassword({email,password:senha});
  if(error){msg.className='msg err';msg.textContent='E-mail ou senha inválidos.';return;}
  await carregarUsuario();
}

async function carregarUsuario(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return;
  const {data:u,error}=await sb.from('lat_usuario').select('*').eq('id',user.id).maybeSingle();
  if(error||!u){document.getElementById('lg-msg').className='msg err';document.getElementById('lg-msg').textContent='Usuário sem acesso ao laticínio.';await sb.auth.signOut();return;}
  ME=u;
  if(u.estabelecimento_id){
    const {data:e}=await sb.from('lat_estabelecimento').select('*').eq('id',u.estabelecimento_id).maybeSingle();
    ESTAB=e;
  }
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('u-nome').textContent=u.nome;
  document.getElementById('u-perfil').textContent=({estabelecimento:'Estabelecimento',auditor:'Auditor',administrador:'Administrador'})[u.perfil];
  montarTabs();
}

async function sair(){await sb.auth.signOut();location.reload();}

function montarTabs(){
  const tabs=document.getElementById('tabs');
  let abas;
  if(ME.perfil==='estabelecimento'){
    abas=[['inicio','Início'],['lotes','Lotes de Leite'],['estoque','Estoque'],['fichas','Fichas Técnicas'],['producao','Produção'],['maturacao','Maturação'],['chancela','Minha Chancela']];
  }else{ // auditor / admin (BIOTEC)
    abas=[['inicio','Início'],['estabs','Estabelecimentos'],['chancelas','Chancelas'],['auditoria','Auditoria']];
  }
  tabs.innerHTML=abas.map(([k,l],i)=>`<button class="tab${i===0?' on':''}" data-k="${k}" onclick="irPara('${k}',this)">${l}</button>`).join('');
  irPara(abas[0][0]);
}
function irPara(k,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.k===k));
  if(el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));el.classList.add('on');}
  VIEWS[k]&&VIEWS[k]();
}

const V=()=>document.getElementById('view');

// ==================== VIEWS ====================
const VIEWS={
  inicio: async ()=>{
    if(ME.perfil==='estabelecimento'){
      const [{data:lotes},{data:prod},{data:fichas}]=await Promise.all([
        sb.from('lat_lote_leite').select('saldo_litros,situacao').eq('estabelecimento_id',ME.estabelecimento_id),
        sb.from('lat_producao').select('cura_status').eq('estabelecimento_id',ME.estabelecimento_id),
        sb.from('lat_ficha_tecnica').select('id').eq('estabelecimento_id',ME.estabelecimento_id).eq('ativo',true)
      ]);
      const saldo=(lotes||[]).reduce((s,l)=>s+Number(l.saldo_litros||0),0);
      const restr=(lotes||[]).filter(l=>l.situacao==='restrito').length;
      const cura=(prod||[]).filter(p=>p.cura_status==='em_cura').length;
      V().innerHTML=`<h2 class="sec" style="text-align:center">Olá, ${esc(ESTAB?ESTAB.nome:ME.nome)}</h2>
      <div class="stats">
        <div class="stat"><div class="n">${saldo.toFixed(0)} L</div><div class="l">Leite em estoque</div></div>
        <div class="stat"><div class="n">${restr}</div><div class="l">Lotes restritos</div></div>
        <div class="stat"><div class="n">${cura}</div><div class="l">Em maturação</div></div>
        <div class="stat"><div class="n">${(fichas||[]).length}</div><div class="l">Fichas ativas</div></div>
      </div>
      <div class="panel"><h3>Como funciona</h3>
      <p style="color:var(--txt-dim);font-size:14px">Registre a entrada do leite em <b style="color:var(--txt)">Lotes de Leite</b> (com o checklist de recebimento). Depois crie suas <b style="color:var(--txt)">Fichas Técnicas</b> (produtos) e faça a <b style="color:var(--txt)">Produção</b>, que dá baixa no estoque e inicia a <b style="color:var(--txt)">Maturação</b>. O QR fica na aba <b style="color:var(--txt)">Minha Chancela</b>.</p></div>`;
    }else{
      const [{data:estabs},{data:chanc}]=await Promise.all([
        sb.from('lat_estabelecimento').select('id'),
        sb.from('lat_chancela').select('status')

      const ativas=(chanc||[]).filter(c=>c.status==='ativa').length;
      const proc=(chanc||[]).filter(c=>c.status==='em_processo').length;
      V().innerHTML=`<h2 class="sec">Painel BIOTEC · Laticínios</h2>
      <div class="stats">
        <div class="stat"><div class="n">${(estabs||[]).length}</div><div class="l">Estabelecimentos</div></div>
        <div class="stat"><div class="n">${ativas}</div><div class="l">Chancelas ativas</div></div>
        <div class="stat"><div class="n">${proc}</div><div class="l">Em processo</div></div>
      </div>
      <div class="panel"><h3>Fluxo</h3><p style="color:var(--txt-dim);font-size:14px">Cadastre laticínios em <b style="color:var(--txt)">Estabelecimentos</b> (a chancela sai em processo). Após a auditoria, ative a chancela em <b style="color:var(--txt)">Chancelas</b> para o QR ficar público. Documentos de rastreabilidade ficam em <b style="color:var(--txt)">Auditoria</b>.</p></div>`;
    }
  },

  // ---------- ESTABELECIMENTO: LOTES ----------
  lotes: async ()=>{
    V().innerHTML=`<h2 class="sec">Lotes de Leite</h2>
    <div class="panel"><h3>Nova entrada de leite</h3>
      <div class="grid3">
        <div class="f"><label>Espécie</label><select id="lo-esp"><option>bovino</option><option>bubalino</option><option>caprino</option><option>ovino</option></select></div>
        <div class="f"><label>Raça (opcional)</label><input id="lo-raca" placeholder="Ex: Jersey"></div>

        <div class="f"><label>Fazenda / propriedade</label><input id="lo-faz"></div>

async function salvarLote(){
  const vol=parseFloat(document.getElementById('lo-vol').value);
  if(!vol||vol<=0){toast('Informe o volume em litros.');return;}
  const rec={
    estabelecimento_id:ME.estabelecimento_id, codigo:'LT-'+new Date().toISOString().slice(0,7).replace('-','')+'-TEMP',
    especie:document.getElementById('lo-esp').value, raca:document.getElementById('lo-raca').value.trim()||null,
    tipo_leite:document.getElementById('lo-tipo').value, fazenda:document.getElementById('lo-faz').value.trim()||null,
    produtor:document.getElementById('lo-prod').value.trim()||null, municipio:document.getElementById('lo-mun').value.trim()||null,
    volume_litros:vol,
    coleta_em:document.getElementById('lo-col').value||null, processo_em:document.getElementById('lo-proc').value||null,
    chk_temperatura:document.getElementById('lo-temp').value?parseFloat(document.getElementById('lo-temp').value):null,
    chk_acidez:document.getElementById('c-acidez').checked, chk_aspecto:document.getElementById('c-aspecto').checked,
    chk_residuos:document.getElementById('c-residuos').checked, chk_origem_determinada:document.getElementById('c-origem').checked,
    chk_boas_praticas:document.getElementById('c-boas').checked, chk_manual:document.getElementById('c-manual').checked,
    chk_sem_aditivos:document.getElementById('c-aditivos').checked
  };
  const {error}=await sb.from('lat_lote_leite').insert(rec);
  if(error){toast('Erro: '+error.message);return;}
  toast('Lote registrado!');
  ['lo-vol','lo-raca','lo-faz','lo-prod','lo-mun','lo-col','lo-proc','lo-temp'].forEach(i=>document.getElementById(i).value='');
  document.querySelectorAll('#view input[type=checkbox]').forEach(c=>c.checked=false);
  document.getElementById('lo-aviso').innerHTML='';
  listarLotes();
}

}

function montarLotesProd(){
  const sel=document.getElementById('pr-ficha');
  const opt=sel.options[sel.selectedIndex];
  const tipo=opt?opt.dataset.tipo:'';
  const dias=opt?opt.dataset.dias:0;
  const box=document.getElementById('pr-lotes');
  const lotes=window._lotes||[];
  box.innerHTML='<div class="arti-h">Selecionar lotes de leite</div>'+
    (lotes.length?lotes.map(l=>{
      const bloq=(tipo==='cru'&&l.situacao==='restrito');
      return `<label class="chk" style="${bloq?'opacity:.5':''}">
        <input type="checkbox" class="pr-lote" value="${l.id}" data-saldo="${l.saldo_litros}" ${bloq?'disabled':''}>
        ${esc(l.codigo)} · ${esc(l.especie||'')}${l.raca?' '+esc(l.raca):''} · ${Number(l.saldo_litros).toFixed(0)} L
        ${bloq?'<span class="pill rest" style="margin-left:auto">Restrito · bloqueado p/ cru</span>':'<span class="pill '+l.situacao+'" style="margin-left:auto">'+(l.situacao==='restrito'?'Restrito':'Liberado')+'</span>'}
      </label>`;
    }).join(''):'<div class="empty">Sem lotes com saldo.</div>');
}
async function salvarProducao(){
  const fichaId=document.getElementById('pr-ficha').value;
  if(!fichaId){toast('Escolha uma ficha técnica.');return;}
  const lotesSel=[...document.querySelectorAll('.pr-lote:checked')].map(c=>({id:c.value,saldo:parseFloat(c.dataset.saldo)}));
  if(!lotesSel.length){toast('Selecione ao menos um lote.');return;}
  const litros=parseFloat(document.getElementById('pr-litros').value);
  if(!litros||litros<=0){toast('Informe os litros consumidos.');return;}
  const totalSaldo=lotesSel.reduce((s,l)=>s+l.saldo,0);
  if(litros>totalSaldo){toast('Litros acima do saldo disponível.');return;}
  const opt=document.getElementById('pr-ficha').options[document.getElementById('pr-ficha').selectedIndex];
  const dias=parseInt(opt.dataset.dias)||0;
  const rend=parseFloat(document.getElementById('pr-rend').value)||null;
  const curaIni=document.getElementById('pr-cura').value||hoje();
  // cria produção
  const {data:prod,error}=await sb.from('lat_producao').insert({
    estabelecimento_id:ME.estabelecimento_id, ficha_id:fichaId, litros_consumidos:litros,
    rendimento_kg:rend, cura_inicio:curaIni, dias_cura:dias, status:'aguardando'
  }).select('id').single();
  if(error){toast('Erro: '+error.message);return;}
  // distribui a baixa entre os lotes selecionados
  let restante=litros;
  for(const l of lotesSel){
    if(restante<=0)break;
    const usar=Math.min(l.saldo,restante);
    const {error:e2}=await sb.from('lat_consumo_leite').insert({producao_id:prod.id,lote_id:l.id,litros_utilizado:usar});
    if(e2){toast('Erro no consumo: '+e2.message);return;}
    restante-=usar;
  }
  toast('Produção registrada e maturação iniciada!');
  irPara('maturacao');
}

async function cadastrarEstab(){
  const msg=document.getElementById('et-msg');msg.className='msg';msg.textContent='Cadastrando…';
  const body={nome:document.getElementById('et-nome').value.trim(),documento:document.getElementById('et-doc').value.trim(),
    cidade:document.getElementById('et-cid').value.trim(),sim_poa:document.getElementById('et-sim').value.trim(),
    email:document.getElementById('et-email').value.trim(),senha:document.getElementById('et-senha').value};
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch(FN_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok){msg.className='msg err';msg.textContent=j.error||'Erro ao cadastrar.';return;}
  msg.className='msg ok';msg.textContent='Cadastrado! Chancela '+(j.chancela&&j.chancela.codigo?j.chancela.codigo:'emitida')+'.';
  ['et-nome','et-doc','et-cid','et-sim','et-email','et-senha'].forEach(i=>document.getElementById(i).value='');
  listarEstabs();
}
async function listarEstabs(){
  const {data}=await sb.from('lat_estabelecimento').select('*,lat_chancela(codigo,status)').order('criado_em',{ascending:false});
  const el=document.getElementById('et-lista');if(!el)return;
  if(!data||!data.length){el.innerHTML='<div class="empty">Nenhum laticínio cadastrado ainda.</div>';return;}
  el.innerHTML=`<table><thead><tr><th>Nome</th><th>Documento</th><th>Cidade</th><th>Chancela</th></tr></thead><tbody>`+
    data.map(e=>{const c=Array.isArray(e.lat_chancela)?e.lat_chancela[0]:e.lat_chancela;return `<tr><td>${esc(e.nome)}</td><td>${esc(e.documento)}</td><td>${esc(e.cidade||'—')}</td><td>${c?'<span class="mono">'+esc(c.codigo)+'</span> <span class="pill '+c.status+'">'+({ativa:'Ativa',em_processo:'Em processo',suspensa:'Suspensa'})[c.status]+'</span>':'—'}</td></tr>`;}).join('')+`</tbody></table>`;
}
async function mudarStatus(id,status){
  const patch={status};if(status==='ativa')patch.auditado_em=hoje();
  const {error}=await sb.from('lat_chancela').update(patch).eq('id',id);
  if(error){toast('Erro: '+error.message);return;}
  toast('Status atualizado.');VIEWS.chancelas();
}

// ==================== QR ====================
function gerarQR(link){
  const box=document.getElementById('qr-box');if(!box)return;box.innerHTML='';
  const img=new Image();
  img.src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(link);
  img.style.width='100%';img.style.height='100%';box.appendChild(img);
}
function verQR(codigo){
  const link=location.origin+location.pathname.replace('index.html','')+'verifica.html?c='+codigo;
  const bg=document.createElement('div');bg.className='modal-bg';bg.onclick=()=>bg.remove();
  bg.innerHTML=`<div class="modal" onclick="event.stopPropagation()">
    <div style="font-family:'Playfair Display',serif;font-size:20px;color:var(--butter);margin-bottom:12px">${esc(codigo)}</div>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(link)}">
    <div style="font-size:11px;color:var(--txt-dim);word-break:break-all;margin:12px 0">${esc(link)}</div>
    <button class="btn btn-sm" onclick="baixarQR('${esc(codigo)}')">Baixar PNG</button>
  </div>`;
  document.body.appendChild(bg);
}
function baixarQR(codigo){
  const link=location.origin+location.pathname.replace('index.html','')+'verifica.html?c='+codigo;
  const a=document.createElement('a');
  a.href='https://api.qrserver.com/v1/create-qr-code/?size=600x600&data='+encodeURIComponent(link);
  a.download='QR-'+codigo+'.png';a.target='_blank';document.body.appendChild(a);a.click();a.remove();
}

// sessão persistente
sb.auth.getSession().then(({data})=>{if(data.session)carregarUsuario();});
</script>
